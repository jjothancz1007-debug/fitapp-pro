<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="CSS/registro.css">
</head>
<body>
  <div class="contenedor">
    <div class="card grande">
      <button id="toggleTema" class="tema-fijo">🌙</button>

      <div class="logo">🏃</div>
      <h1>Crear cuenta</h1>
      <p class="subtitulo">Regístrate en FitApp Pro</p>

      <input id="usuario" type="text" placeholder="Usuario">

      <div class="password-box">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="ver" type="button" class="btn-ver">👁</button>
      </div>

      <button id="btnRegistro">Registrar</button>

      <div id="loader" class="loader">Cargando...</div>
      <p id="msg" class="mensaje"></p>

      <a href="Index.html" class="link-sec">Volver al login</a>
    </div>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
