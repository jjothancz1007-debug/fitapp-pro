<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="contenedor">
    <div class="card grande">
      <button id="toggleTema" class="tema-fijo">🌙</button>

      <div class="logo">🏋️</div>
      <h1>FitApp Pro</h1>
      <p class="subtitulo">Inicia sesión para continuar</p>

      <input id="usuario" type="text" placeholder="Usuario">

      <div class="password-box">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="ver" type="button" class="btn-ver">👁</button>
      </div>

      <button id="btnLogin">Entrar</button>

      <div id="loader" class="loader">Cargando...</div>
      <p id="msg" class="mensaje"></p>

      <a href="registro.html" class="link-sec">Crear cuenta</a>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
